<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Header colour in each theme (tokens: --color-header). -->
    <meta name="theme-color" content="#1f5f7a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17253e" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Balances, bills, budgets and reconciliation from your M-PESA and bank SMS."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Pesa Dashboard</title>
    <script>
      // Apply a saved theme override before first paint (key: THEME_STORAGE_KEY in src/lib/theme.ts).
      try {
        var theme = localStorage.getItem("pesa-theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
